<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitin's Website</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            background: #f4f6f9;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 50px 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.8rem;
        }
        header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        .container {
            max-width: 800px;
            margin: -30px auto 0;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h2 {
            color: #667eea;
            border-left: 4px solid #667eea;
            padding-left: 10px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        ul li {
            background: #f0f2ff;
            margin: 8px 0;
            padding: 12px 15px;
            border-radius: 8px;
        }
        ul li::before {
            content: "🚀 ";
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            background: #667eea;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            color: #888;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Website hi Nitin 👋</h1>
        <p>Developer | Designer | Learner</p>
    </header>

    <div class="container">
        <p>This is a sample paragraph of text. HTML is used to structure the content of web pages. Now it's looking professional!</p>

        <h2>My Favorite Things</h2>
        <ul>
            <li>Coding</li>
            <li>Designing</li>
            <li>Learning</li>
        </ul>

        <a href="https://developer.mozilla.org" target="_blank" class="btn">Visit MDN Docs</a>
    </div>

    <footer>
        © 2026 Made by Nitin with ❤️
    </footer>
</body>
</html>
